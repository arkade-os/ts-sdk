packages:
  - packages/*
  - examples/*

overrides:
  # react and react-dom must resolve to the EXACT same version or React throws
  # "Incompatible React versions" at render time. With node-linker=hoisted plus
  # auto-install-peers, Next's peer auto-install and the example's own dependency
  # otherwise land on different patches (seen: react 19.2.4 vs react-dom 19.2.8).
  # Pinning both here is the only place that binds every resolution path.
  react: "19.2.8"
  react-dom: "19.2.8"
  esbuild: ">=0.28.1"
  minimatch: "^10.2.5"
  "@ungap/structured-clone": ">=1.3.1"
  "@xmldom/xmldom": ^0.8.13
  node-forge: ^1.4.0
  postcss: ^8.5.10
  vite: ^7.3.6
  "ws@8": ">=8.20.1"
  "js-yaml@<4": ">=3.15.0 <4.0.0"
  "js-yaml@>=4": ">=4.2.0 <5.0.0"
  linkify-it: ">=5.0.1 <6.0.0"
  markdown-it: ">=14.2.0"
  uuid: ">=11.1.1 <12.0.0"
  "picomatch@>=4": ">=4.0.4"
  "@babel/core": ">=7.29.6"

onlyBuiltDependencies:
  - better-sqlite3
  - canvas
  - sqlite3
  - "@arkade-os/sdk"

ignoredBuiltDependencies:
  - canvas
  - esbuild
