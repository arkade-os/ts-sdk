packages:
  - packages/*
  - examples/*

overrides:
  # react and react-dom must resolve to the EXACT same version or React throws
  # "Incompatible React versions" at render time. With node-linker=hoisted plus
  # auto-install-peers, Next's peer auto-install and the example's own dependency
  # otherwise land on different patches (seen: react 19.2.4 vs react-dom 19.2.8).
  # Pinning both here is the only place that binds every resolution path.
  react: "19.2.8"
  react-dom: "19.2.8"
  esbuild: ">=0.28.1"
  minimatch: ">=11.0.1"
  "typedoc>minimatch": "^10.2.5"
  "glob@>=13": ">=14.0.2"
  "@ungap/structured-clone": ">=1.3.1"
  "@xmldom/xmldom": ^0.8.15
  node-forge: ^1.4.1
  postcss: ">=8.5.23"
  vite: ^7.3.7
  brace-expansion: ">=5.0.11"
  shell-quote: ">=1.11.0"
  "ws@8": ">=8.20.1"
  "js-yaml@<4": ">=3.15.2 <4.0.0"
  "js-yaml@>=4": ">=4.3.2 <5.0.0"
  linkify-it: ">=5.0.1 <6.0.0"
  markdown-it: ">=14.3.3 <15.0.0"
  uuid: ">=11.1.1 <12.0.0"
  "picomatch@>=4": ">=4.0.4"
  "@babel/core": ">=7.29.6"
  image-size: ">=2.0.3"
  browserslist: ">=4.28.7"
  compression: ">=1.8.2"
  "@expo/cli>zod": ">=4.6.6"
  nanoid: ">=3.3.18 <4.0.0"
  source-map-js: ">=1.2.2"
  # sats-connect 4.2.1 (latest) pins both exactly.
  axios: ">=1.16.0 <2.0.0"
  valibot: ">=1.2.0 <2.0.0"

onlyBuiltDependencies:
  - canvas
  - sqlite3
  - "@arkade-os/sdk"

ignoredBuiltDependencies:
  - canvas
  - esbuild

auditConfig:
  # No picomatch release fixes this ReDoS yet, and it reaches us only through build tooling
  # (tsup, react-native's metro) matching our own globs. Drop it once a fix ships.
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
