# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review policy lives in REVIEW.md and AGENTS.md; this file only wires CodeRabbit to it.
language: en-US
tone_instructions: >-
  Follow REVIEW.md: its priority order, out-of-scope list and severity cap. Report nothing
  outside the priorities. Be terse; no praise, no restating the diff.

reviews:
  profile: chill
  # Writes release notes into the PR description and makes the description check skip itself.
  high_level_summary: false
  sequence_diagrams: false
  related_issues: false
  related_prs: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  path_filters:
    - "!pnpm-lock.yaml"

  path_instructions:
    - path: "packages/**"
      instructions: >-
        Flag any fromPSBT call on @scure/btc-signer's Transaction, however imported; use the
        SDK's Transaction (AGENTS.md, Decoding PSBTs).
    - path: "packages/sdk/**"
      instructions: >-
        sdk must not import from or special-case plugin packages (AGENTS.md, Core Package).
    - path: "packages/sdk/src/contracts/**"
      instructions: >-
        Enforce AGENTS.md "Contracts Subsystem Ownership": only ContractManager writes
        repositories; ContractWatcher only emits events.
    - path: "packages/swap/**"
      instructions: >-
        Flag logic that duplicates an sdk utility, branching on wallet type, and any minted
        signing/refund/claim key (AGENTS.md, Key Provisioning Ownership).

  # Formatting is CI's job (biome); prose linters produce the nits REVIEW.md rules out.
  tools:
    biome:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false

  # Docstring generation and coverage push against REVIEW.md's comment rules.
  finishing_touches:
    docstrings:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    # Replaced by the REVIEW.md-based check below.
    description:
      mode: "off"
    title:
      mode: warning
      requirements: >-
        Conventional commit form, type(scope): summary, e.g. "fix(sdk): ...".
    custom_checks:
      - name: PR description
        mode: warning
        instructions: >-
          Fail if the description is empty, only links elsewhere, or has no information on
          how the change was tested. Fail if it is a file-by-file walkthrough. Pass if it
          states what changed, why, and how it was tested. Ignore any text generated by
          CodeRabbit.
      - name: Size and scope
        mode: warning
        instructions: >-
          Count changed lines as additions plus deletions, excluding pnpm-lock.yaml. At or
          below 440, pass. Above 440, fail if the diff spans more than one topic, or if the
          description does not account for a change in the diff; name the topics or the
          unexplained changes. Otherwise pass.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "REVIEW.md"
